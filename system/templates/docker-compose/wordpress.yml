# Docker Compose template for WordPress applications
# Generated by docker_manager.py -- do NOT edit manually.
# Uses Nginx + PHP-FPM managed by Nixpacks with persistent wp-content volume.

name: "vexlyx-{{service_name}}"

services:
  app:
    image: "{{image_name}}"
    restart: unless-stopped
    environment:
      PORT: "{{container_port}}"
      HOST: "0.0.0.0"
      PHP_MEMORY_LIMIT: "{{memory_limit}}"
{{env_block}}
    ports:
      - "{{host_port}}:{{container_port}}"
    volumes:
      - ./wp-content:/app/wp-content
    deploy:
      resources:
        limits:
          memory: "{{memory_limit}}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:{{container_port}}/ || wget -qO- http://localhost:{{container_port}}/wp-login.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.{{service_name}}.rule=Host(`{{hostname}}`)"
      - "traefik.http.routers.{{service_name}}.entrypoints=web"
      - "traefik.http.services.{{service_name}}.loadbalancer.server.port={{container_port}}"

networks:
  default:
    external: true
    name: traefik-net
