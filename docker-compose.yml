services:
  postgres:
    image: postgres:16-alpine
    container_name: vexlyx-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vexlyx
      POSTGRES_PASSWORD: vexlyx_dev
      POSTGRES_DB: vexlyx_dev
    volumes:
      - vexlyx_postgres_data:/var/lib/postgresql/data
    networks:
      - default
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vexlyx -d vexlyx_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mysql:
    image: mysql:8.0
    container_name: vexlyx-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: vexlyx_mysql_root
      MYSQL_DATABASE: vexlyx_dev
      MYSQL_USER: vexlyx
      MYSQL_PASSWORD: vexlyx_dev
    volumes:
      - vexlyx_mysql_data:/var/lib/mysql
    networks:
      - default
      - traefik-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pvexlyx_mysql_root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: vexlyx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - vexlyx_redis_data:/data
    networks:
      - default
      - traefik-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  adminer:
    image: adminer:4
    container_name: vexlyx-adminer
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      ADMINER_DEFAULT_SERVER: vexlyx-postgres
    networks:
      - default
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`db.vexlyx.localhost`)"
      - "traefik.http.routers.adminer.entrypoints=web"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"

  traefik:
    image: traefik:v3.4
    container_name: vexlyx-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    environment:
      - DOCKER_API_VERSION=1.45
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./docker/traefik/certs:/etc/traefik/certs:ro
      - ./docker/traefik/acme.json:/etc/traefik/acme.json
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
      - traefik-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  coredns:
    image: coredns/coredns:1.11.3
    container_name: vexlyx-coredns
    restart: unless-stopped
    command: -conf /etc/coredns/Corefile
    ports:
      - "${DNS_PORT:-53}:53/udp"
      - "${DNS_PORT:-53}:53/tcp"
    volumes:
      - ./docker/coredns/Corefile:/etc/coredns/Corefile:ro
      - ./docker/coredns/zones:/etc/coredns/zones:ro
    networks:
      - default
      - traefik-net

volumes:
  vexlyx_postgres_data:
  vexlyx_mysql_data:
  vexlyx_redis_data:

networks:
  default:
  traefik-net:
    external: true
